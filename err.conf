# err configuration. `key = value`, one per line. Comments go on their own line.

# Thinking trace for models that have one: default | on | off
thinking = default

# ── model ───────────────────────────────────────────────────────────
# Where questions go: fm (Apple on-device), pcc (Private Cloud Compute), or
# mlx (the model served on mlx_base_url). `err run` / `err switch` set this.
backend = mlx
# fm model: system | pcc
model_id = system
mlx_base_url = http://127.0.0.1:11500
# Start the last-run model when nothing serves mlx_base_url yet. off = never
# load weights behind your back.
mlx_autostart = on
# Only for a remote OpenAI-compatible server. Never "system".
# mlx_model = some-org/some-model

# ── answers ─────────────────────────────────────────────────────────
# Sampling temperature (must be > 0), shared by answers and the server
temperature = 0.7
max_tokens = 2048
# Verbatim turns kept in the conversation window
history_turns = 6
# Command the model suggests: history (↑ recalls it) | ask (edit buffer) | off
suggest = history
# Lines of the last command's output sent to the model
output_lines = 40

# System prompts: what err wtf and err "<question>" tell the model.
# Keep the one fenced example in question_system_prompt: it feeds `suggest`.
explain_system_prompt = You explain what a shell command did on macOS zsh. Answer in a few sentences: what it did, and if it failed, why. Name the command an alias runs. Do not include a code block. You see the command, its exit code, and any output err captured. A dquote> prompt means the command is incomplete and did not run, usually because ! inside double quotes triggered history expansion.
question_system_prompt = You answer questions for a macOS zsh user, technical or not. Give a few sentences of plain explanation. Decide for yourself whether running a command would genuinely help. If it would, end your answer with exactly one fenced code block containing only that command and nothing else, then stop; the user can recall it with the up arrow. If no command would help, end with plain prose and no code block. Prefer single quotes, for example echo 'Hello, world!': ! inside double quotes triggers history expansion and leaves the shell at dquote>. Never print a command that would leave the shell waiting for input. You see the last command, its exit code, and any output err captured; if output is missing, say so.

# Appended to the question by exit code
prompt_success = In two or three sentences, explain what running it did and what the output shows.
prompt_not_found = The command was not found. In two or three sentences, say it may be a typo or not installed and how to check; do not suggest alternative commands.
prompt_fail = In two or three sentences, explain what went wrong based on the error output and how to fix it.
prompt_unknown = The exit code is unknown. In two or three sentences, explain what the command likely does, without assuming it failed.

# ── server ──────────────────────────────────────────────────────────
# fm server port
port = 8080
# Stop a server err started after this many idle minutes
idle_timeout_minutes = 10
# Streaming-MoE expert cache in GiB. Non-MoE models ignore it.
# moe_cache_gib = 6
# Extra flags for mlx_vlm.server, one per line
# server_flag = --kv-bits 8

# ── terminal ────────────────────────────────────────────────────────
# pty = record command output through a PTY proxy shell | off
capture = pty

# ── prefix cache (APC) ──────────────────────────────────────────────
apc_enabled = 1
# Per model directory, GiB
apc_disk_max_gb = 2
# All models together, GiB (0 = no cap)
apc_total_gb = 6
# Entries untouched this many days are deleted (0 = keep)
apc_max_age_days = 7
