# err 0.5 configuration
# All settings have sensible defaults.

# ── model ───────────────────────────────────────────────────────────

# Apple Foundation Model to use: system (on-device, default) or pcc
# (Private Cloud Compute). No download needed — the model ships with macOS.
model_id = system

# ── prompts ─────────────────────────────────────────────────────────

# Prompt used when the command succeeded (exit 0)
prompt_success = The command ran successfully (exit 0). In one short sentence, confirm that it worked and explain what the command does. Only if the context explicitly provides a shell-config definition for the command should you incorporate it; otherwise do not mention shell config.

# Prompt used when the command failed (exit != 0)
prompt_fail = In one or few short sentences: what went wrong? If it looks like a typo, say so. Only if the context explicitly provides a shell-config definition for the command should you incorporate it; otherwise do not mention shell config.

# Prompt used when the exit code is unknown (command recovered from history)
prompt_unknown = If the context explicitly provides a shell-config definition for the command, state it and explain what the command does. Otherwise, explain what the command likely does. Do not assume it failed unless there is evidence of an error.

# ── server ──────────────────────────────────────────────────────────

# Port for the fm server (stays running between invocations)
port = 8080

# Shut the server down after this many minutes of inactivity
idle_timeout_minutes = 10

# ── model parameters ────────────────────────────────────────────────

# Maximum tokens in the response
max_tokens = 200

# Sampling temperature (must be > 0; 0.7 recommended)
temperature = 0.7
