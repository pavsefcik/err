# err configuration
# All settings have sensible defaults.

# ── model ───────────────────────────────────────────────────────────

# Apple Foundation Model to use: system (on-device, default) or pcc
# (Private Cloud Compute). No download needed — the model ships with macOS.
model_id = system

# ── prompts ─────────────────────────────────────────────────────────
#
# The two system prompts have built-in defaults (err.py: DEFAULT_SYSTEM_PROMPT
# and DEFAULT_QUESTION_PROMPT); they are NOT repeated here, so there is exactly
# one definition of each. `err doctor` prints the one in force and says whether
# it is builtin or custom. Uncomment a line to override it:
#
#   explain_system_prompt = <your explain prompt>
#     Runs on `err what` / `errc`. Two rules matter: keep it to a sentence-sized
#     answer, and do not ask for a code block — the first fenced line is fed to
#     the suggestion channel, so a block here puts commands in your history.
#   question_system_prompt = <your question prompt>
#     Runs on `err "<question>"`. Asking for one example command in a fenced
#     block is the contract behind `suggest = history|ask`; drop it only if you
#     want questions to stop offering commands.
#
# `system_prompt` is the old name of `explain_system_prompt` and is still read
# (legacy confs keep working); `explain_system_prompt` wins if both are set.
#
# The *suffixes* below are not system prompts: they are appended to the user
# message depending on the exit code.

# Appended when the command succeeded (exit 0)
prompt_success = Explain in one short sentence what running it did.

# Appended when the command was not found (exit 127)
prompt_not_found = The command was not found. In one short sentence, say it may be a typo or not installed. Do not suggest alternative commands.

# Appended for other failures (exit != 0)
prompt_fail = In one or two short sentences, explain what went wrong based on the error output.

# Appended when the exit code is unknown (command recovered from history)
prompt_unknown = The exit code is unknown. In one short sentence, explain what the command likely does, without assuming it failed.

# How many lines of the last command's output err sends to the model — from
# `errc`, or from `cmd | err why` (a plain command's stdout is never captured).
# 40 is enough for an explanation; more mostly makes the small models worse.
# output_lines = 40

# ── backend ─────────────────────────────────────────────────────────

# Where requests go: fm (existing behaviour), mlx (the :11500 server) or pcc
# (fm with model_id=pcc).
backend = mlx

# OpenAI-compatible server used when backend = mlx
mlx_base_url = http://127.0.0.1:11500

# Start the saved model when nothing is serving mlx_base_url yet: `err "<question>"`
# then stops whatever model holds :11500 and starts this one, instead of asking
# you to run `err run <model>` first. on (default) | off — set off to keep
# err from loading gigabytes of weights behind your back (scripts, CI).
mlx_autostart = on

# Model id sent to that server. Leave it unset: err uses the model it recorded
# when you last ran/switched one ($ERR_STATE_DIR/last-model), which is right for
# the local :11500 server. Set it only for a remote/other OpenAI-compatible
# server, and never to "system" — that value belongs to the fm backend.
# mlx_model = some-org/some-model

# ── conversation ────────────────────────────────────────────────────

# Verbatim turns kept in the window and sent as prior messages
history_turns = 6

# What to do with the command in a fenced code block: ask, history or off
# What to do with the command the model recommends:
#   history  append it to your shell history (press ↑ to recall and run it)
#   ask      drop it into the prompt buffer, ready to edit
#   off      never offer it
suggest = history

# ── server ──────────────────────────────────────────────────────────

# Port for the fm server (stays running between invocations)
port = 8080

# Shut a server err started down after this many minutes of inactivity
# (fm on `port`, and every MLX model — 11500 or an `err runs` port). Inactivity
# means no request, no open connection and no CPU from the server process.
idle_timeout_minutes = 10

# ── sampling ────────────────────────────────────────────────────────
#
# ONE setting each, shared by `err "<question>"` and by the `:11500` server.
# They used to live in two files with two values (0.3/200 for explanations,
# 0.7/2048 for the old chat), which read as a bug.

max_tokens = 2048

# Sampling temperature (must be > 0)
temperature = 0.7

# ── legacy chat settings ─────────────────────────────────────────────

# Show a model's reasoning trace when it has one: default | on | off
# (default and off both hide it; the family decides the control knob).
thinking = default

# Kept for old config files; the interactive chat was removed. Empty = unset.
# chat_system_prompt =

# Streaming-MoE expert cache, in GiB (empty = 6). Non-MoE models ignore it.
# moe_cache_gib =

# ── launch flags (passthrough to mlx_vlm) ───────────────────────────
#
# Repeatable, one flag (and its value) per line. Anything `mlx_vlm.server`
# accepts goes here; err does not validate it. `chat_flag` is informational
# (the chat REPL talks HTTP), `server_flag` is what the server is launched with.
#
# server_flag = --kv-bits 8
# server_flag = --adapter-path /path/to/adapter
# server_flag = --max-kv-size 4096
# chat_flag = --thinking-budget 100

# ── prefix caching (APC) ────────────────────────────────────────────

# 1 = on (default), 0 = off
apc_enabled = 1

# Per-model-directory disk cap for the prefix cache, GiB
apc_disk_max_gb = 18
