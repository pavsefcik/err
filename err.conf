# err 0.5 configuration
# All settings have sensible defaults.

# ── model ───────────────────────────────────────────────────────────

# Apple Foundation Model to use: system (on-device, default) or pcc
# (Private Cloud Compute). No download needed — the model ships with macOS.
model_id = system

# ── prompts ─────────────────────────────────────────────────────────

# System prompt used when explaining a command
system_prompt = You explain what a shell command did on macOS zsh. Answer in one short sentence. If the command is an alias, say which command the alias runs.

# System prompt used for freeform questions (err <question>)
question_system_prompt = You answer shell questions for macOS zsh. Reply in at most three short sentences, then give one example command in a fenced code block. If the answer needs no command, skip the code block.

# Appended when the command succeeded (exit 0)
prompt_success = Explain in one short sentence what running it did.

# Appended when the command was not found (exit 127)
prompt_not_found = The command was not found. In one short sentence, say it may be a typo or not installed. Do not suggest alternative commands.

# Appended for other failures (exit != 0)
prompt_fail = In one or two short sentences, explain what went wrong based on the error output.

# Appended when the exit code is unknown (command recovered from history)
prompt_unknown = The exit code is unknown. In one short sentence, explain what the command likely does, without assuming it failed.

# ── server ──────────────────────────────────────────────────────────

# Port for the fm server (stays running between invocations)
port = 8080

# Shut the server down after this many minutes of inactivity
idle_timeout_minutes = 10

# ── model parameters ────────────────────────────────────────────────

# Maximum tokens in the response
max_tokens = 200

# Sampling temperature (must be > 0; low values keep the small model consistent)
temperature = 0.3
