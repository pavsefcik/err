# err 0.4 configuration
# All settings have sensible defaults.

# ── model ───────────────────────────────────────────────────────────

# MLX model ID (downloaded automatically on first run)
model_id = mlx-community/gemma-4-e2b-it-4bit

# ── prompts ─────────────────────────────────────────────────────────

# Prompt used when the command succeeded (exit 0)
prompt_success = In 1 short sentence: what does this command do?

# Prompt used when the command failed (exit != 0)
prompt_fail = In one or few short sentences: what went wrong? If it looks like a typo, say so.

# ── server ──────────────────────────────────────────────────────────

# Port for the mlx-lm server (stays running between invocations)
port = 8080

# ── model parameters ────────────────────────────────────────────────

# Maximum tokens in the response
max_tokens = 200

# Sampling temperature (must be > 0; 0.7 recommended)
temperature = 0.7
